# UiKit page contract (REQ-UI-003) and REQ-DEMO-014: UiKit's default theme, unchanged (no theme tokens, no CSS
# framework, no CDN); the demo shell is the admin layout of the instance settings pages.
nowo_ui_kit:
    css_framework: custom
    base_stylesheet: true
    icon_set: none
    layouts:
        admin: 'base.html.twig'
        guest: 'base.html.twig'
